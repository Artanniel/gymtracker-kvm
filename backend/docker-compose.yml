version: '3.8'

# ═══════════════════════════════════════════════════════════════════
# GymTracker - Compartilha infraestrutura com InvoiceBuilder
# PostgreSQL e Keycloak são os mesmos, apenas schema e realm diferentes
# ═══════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL (mesmo do InvoiceBuilder, porta 5432) ───────────
  db:
    image: postgres:15
    container_name: gymtracker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: invoicepro  # Mesmo database do InvoiceBuilder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak (mesmo do InvoiceBuilder, porta 8081 externa) ─────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: gymtracker-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/invoicepro
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      db:
        condition: service_healthy

  # ── GymTracker Backend (porta 8082 para evitar conflitos) ─────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymtracker-backend
    environment:
      - QUARKUS_DATASOURCE_USERNAME=postgres
      - QUARKUS_DATASOURCE_PASSWORD=password
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/invoicepro
      - QUARKUS_OIDC_AUTH_SERVER_URL=http://keycloak:8080/realms/gymtracker
      - QUARKUS_HTTP_PORT=8082
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  postgres_data:
