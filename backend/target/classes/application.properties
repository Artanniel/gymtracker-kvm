# ═══════════════════════════════════════════════════════════════════
# GymTracker Backend - Configuration
# Reaproveita infraestrutura do InvoiceBuilder (PostgreSQL + Keycloak)
# ═══════════════════════════════════════════════════════════════════

# ── HTTP ──────────────────────────────────────────────────────────
# Porta 8082 para evitar conflito com InvoiceBuilder (8080) e Keycloak (8081)
quarkus.http.port=8082
quarkus.http.host=0.0.0.0

# ── Database (Dev - H2 in-memory) ────────────────────────────────
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:gymtracker;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.liquibase.migrate-at-start=false

# ── Database (Test - H2) ────────────────────────────────────────
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.liquibase.migrate-at-start=false
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.enabled=false
%test.quarkus.http.port=8090

# ── Test HTTP Port ──────────────────────────────────────────────
quarkus.test.http.port=8090

# ── Database (Prod - PostgreSQL - mesmo DB do InvoiceBuilder) ────
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:postgres}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:postgres}
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/invoicepro}

# Schema isolation - usa schema separado no mesmo banco
%prod.quarkus.hibernate-orm.database.default-schema=gymtracker
%prod.quarkus.liquibase.default-schema-name=gymtracker

# ── Hibernate ─────────────────────────────────────────────────────
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ── Liquibase ─────────────────────────────────────────────────────
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changeLog.xml

# ── OIDC / Keycloak (Dev - DevServices) ──────────────────────────
%dev.quarkus.keycloak.devservices.enabled=false
%dev.quarkus.keycloak.devservices.port=8181
%dev.quarkus.keycloak.devservices.realm-name=gymtracker
%dev.quarkus.keycloak.devservices.roles=user
%dev.quarkus.keycloak.devservices.users.alice=alice,user
%dev.quarkus.keycloak.devservices.clients.gymtracker-frontend.redirect-uris=http://localhost:5173/*
%dev.quarkus.keycloak.devservices.clients.gymtracker-frontend.client-authenticator-type=client-secret
%dev.quarkus.keycloak.devservices.clients.gymtracker-frontend.secret=frontend-secret

# ── OIDC (Backend is bearer-only) ────────────────────────────────
%dev.quarkus.oidc.auth-server-url=http://localhost:8181/realms/gymtracker
%dev.quarkus.oidc.client-id=gymtracker-backend
%dev.quarkus.oidc.credentials.secret=secret

# ── OIDC (Prod - mesmo Keycloak do InvoiceBuilder) ───────────────
%prod.quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/gymtracker}
%prod.quarkus.oidc.client-id=${QUARKUS_OIDC_CLIENT_ID:gymtracker-backend}
%prod.quarkus.oidc.credentials.secret=${QUARKUS_OIDC_CREDENTIALS_SECRET:secret}

# ── CORS ──────────────────────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000,http://localhost:8082
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# ── Health ────────────────────────────────────────────────────────
quarkus.smallrye-health.enabled=true
quarkus.smallrye-health.ui.enabled=true

# ── Metrics ───────────────────────────────────────────────────────
quarkus.micrometer.enabled=true
quarkus.micrometer.registry-prometheus.enabled=true

# ── Logging ───────────────────────────────────────────────────────
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=DEBUG
quarkus.log.console.darken=1
