complexity:
  LongMethod:
    threshold: 300
  LongParameterList:
    functionThreshold: 12
    constructorThreshold: 14
  CyclomaticComplexMethod:
    threshold: 30
  TooManyFunctions:
    active: false
  NestedBlockDepth:
    active: false

style:
  MaxLineLength:
    maxLineLength: 200
    ignoreAnnotated:
      - Composable
  UnusedPrivateMember:
    active: false
  UnusedPrivateProperty:
    active: false
  UnusedParameter:
    active: false
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  ForbiddenComment:
    active: false
  ReturnCount:
    active: false
  NewLineAtEndOfFile:
    active: false
  UseCheckOrError:
    active: false

naming:
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    ignoreAnnotated:
      - Composable
  MatchingDeclarationName:
    active: false

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
